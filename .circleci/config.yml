---
version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@0.1.1

parameters:
  manual-deploy:
    type: boolean
    default: false


workflows:
  version: 2
  pushbuild:
    unless: << pipeline.parameters.manual-deploy >>
    jobs:
      # Build jobs
      - greenzie/debian_build:
          context: GREENZIE
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64
          clone_submodules: false

  manualdeploy:
    when: << pipeline.parameters.manual-deploy >>
    jobs:
      # Build jobs
      - greenzie/debian_build:
          context: GREENZIE
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      # Deployment jobs
      - greenzie/debian_deploy_experimental:
          name: "deploy_amd64_greenzie"
          context: GREENZIE
          filters:
            branches:
              only:
                - noetic
          requires:
            - amd_debian_build
