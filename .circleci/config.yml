---
version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@0.1.3

parameters:
  manual_deploy:
    description: "Trigger a manual deploy to greenzie-experimental and greenzie-public-experimental."
    type: boolean
    default: false
  deploy_public:
    description: "Deploy only to greenzie-public-experimental (skips greenzie-experimental). For testing the public channel."
    type: boolean
    default: false


workflows:
  version: 2
  pushbuild:
    when:
      and:
        - not: << pipeline.parameters.manual_deploy >>
        - not: << pipeline.parameters.deploy_public >>
    jobs:
      - greenzie/debian_build:
          context: GREENZIE
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64
          clone_submodules: false

  manualdeploy:
    when: << pipeline.parameters.manual_deploy >>
    jobs:
      - greenzie/debian_build:
          context: GREENZIE
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      - greenzie/debian_deploy_experimental:
          name: "deploy_amd64_greenzie"
          context: GREENZIE
          filters:
            branches:
              only:
                - noetic
          requires:
            - amd_debian_build

      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_public_experimental"
          context: GREENZIE
          repo_name: experimental-greenzie-public-focal-main
          channel: greenzie-public-experimental
          filters:
            branches:
              only:
                - noetic
          requires:
            - amd_debian_build

  manualdeploy-public:
    when:
      and:
        - << pipeline.parameters.deploy_public >>
        - not: << pipeline.parameters.manual_deploy >>
    jobs:
      - greenzie/debian_build:
          context: GREENZIE
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_public_experimental"
          context: GREENZIE
          repo_name: experimental-greenzie-public-focal-main
          channel: greenzie-public-experimental
          filters:
            branches:
              only:
                - noetic
          requires:
            - amd_debian_build
